<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" type="image/x-icon" />
		<link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e0f2fe" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Respawn" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Every game cover comes from this origin, so open the connection before
		     the first one is parsed. User avatars live on per-user PDS hosts, which
		     vary, so they can't be hinted statically. -->
		<link rel="preconnect" href="https://images.igdb.com" />

		<meta property="og:site_name" content="Respawn" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:type" content="website" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
